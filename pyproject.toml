[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sidish"
version = "2.4.0"
description = "SIDISH research-use single-cell risk-state analysis and clinician decision support"
requires-python = ">=3.10,<3.13"
license = {text = "MIT"}
authors = [{name = "Yasmin Jolasun"}]
dependencies = [
  "anndata>=0.10,<0.12", "jinja2>=3.1,<4", "lifelines>=0.29,<0.31",
  "matplotlib>=3.8,<4", "numpy>=1.26,<2", "pandas>=2.1,<3",
  "pyro-ppl>=1.9,<2", "pyyaml>=6,<7", "scanpy>=1.10,<1.12",
  "scikit-learn>=1.4,<1.7", "scipy>=1.12,<2", "statsmodels>=0.14,<1",
  "torch>=2.2,<3", "torch-geometric>=2.5,<3", "tqdm>=4.66,<5",
]

[project.optional-dependencies]
app = ["openai>=1.50,<3", "playwright>=1.45,<2", "streamlit>=1.60,<2", "weasyprint>=62,<70"]
test = ["pytest>=8,<9", "pytest-cov>=5,<7"]

[tool.setuptools.packages.find]
include = ["SIDISH*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
